spring:
  application:
    name: ai-catalog-backend
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_SIZE:10MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:11MB}
  ai:
    retry:
      max-attempts: 1
    model:
      chat: ${APP_AI_MODEL:none}
      embedding:
        text: none
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash}
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
  storage:
    type: ${APP_STORAGE_TYPE:cloudinary}
    max-bytes: ${APP_UPLOAD_MAX_BYTES:10485760}
    local-directory: ${APP_STORAGE_LOCAL_DIRECTORY:./uploads}
    local-base-url: ${APP_STORAGE_LOCAL_BASE_URL:http://localhost:8080/media}
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
